[package]
name = "aleparser"
version = "0.2.0"
edition = "2024"
license-file="LICENSE"
repository="https://github.com/aleph-lang/aleparser"
description="Aleph Parser : generate Aleph Syntax Tree."

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3 

[build-dependencies]
lalrpop = { version = "0.22", features = ["lexer"] }

[dependencies]
lalrpop-util = {version = "0.22", features = ["lexer"]}
regex = "1"
aleph-syntax-tree = "0.2"

[dev-dependencies]
# No `path`: this crate exists in more than one local clone location with
# different relative layouts to `alegen` (some as a direct sibling, some
# nested under filters/{parsers,generators}/) — a path override that's
# correct in one breaks `cargo build`/`cargo test`/`cargo publish`'s verify
# step in the other. Registry resolution works from any location once
# alegen 0.2.0 is published (publish alegen first).
alegen = "0.2"

